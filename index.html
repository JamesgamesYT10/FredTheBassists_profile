<html>
  <head>
    <style>
      body {
    background-image: url("your-image-file.jpg"); /* Replace with your image name or URL */
    background-repeat: no-repeat; /* Prevents the image from tiling */
    background-size: cover;      /* Forces image to cover the whole screen */
    background-attachment: fixed; /* Keeps the background from scrolling */
    background-position: center;  /* Centers the image */
    text-align: center;
      }
      .circle-pfp {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    object-fit: cover; /* Keeps image from looking squished */
  }
    </style>
    <link href="/style.css" rel="stylesheet" type="text/css" media="all">
  </head>

    <img src="~images/PfP.jpg" alt="Profile Image" class="circle-pfp">
