<audio id="bgmusic" loop>
    <source src="music/tomtom.ogg" type="audio/ogg">
</audio>

<script>
const music = document.getElementById("bgmusic");
const button = document.querySelector(".top-right-controls button");

music.volume = 0.25;

function toggleMusic() {
    if (music.paused) {
        music.play();
        button.textContent = "⏸ Pause";
    } else {
        music.pause();
        button.textContent = "🎵 Music";
    }
}
</script>
